services:
  # Web (TanStack Start) e API (NestJS) rodam juntos neste único container,
  # via `concurrently` (ver package.json:start:all e Dockerfile).
  # Postgres/Redis/MinIO NÃO são criados aqui: o app usa a stack compartilhada
  # ubva (containers "postgresql", "redis", "minio" na rede srv_default), com
  # usuário/database/bucket dedicados — ver .env.
  utalks:
    image: ubvabrasil/utalks
    container_name: utalks
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${API_PORT}
    ports:
      - "${WEB_HOST_PORT}:8080"
      - "${API_HOST_PORT}:3001"
    networks:
      - srv_default
    restart: unless-stopped
    # O host não suporta NAT hairpin: o container não alcança o próprio IP
    # público (evolution.ubva.com.br resolve pra ele via DNS externo), então
    # a chamada de provisionamento do Evolution trava/expira. Aponta o
    # domínio direto pro host (nginx local já faz o proxy certo por SNI).
    extra_hosts:
      - "evolution.ubva.com.br:host-gateway"

networks:
  srv_default:
    external: true
